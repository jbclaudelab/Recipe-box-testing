<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recipe Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F5EC;--panel:#FFFFFF;--ink:#1E2B22;--mute:#5E6E63;--line:#D5DECE;--acc:#2E6B4F;--acc-ink:#fff;--hi:#F4D35E;
--head:"Bricolage Grotesque","Trebuchet MS",sans-serif;--body:"Source Serif 4",Georgia,serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141B16;--panel:#1D2720;--ink:#E7EFE4;--mute:#98A89C;--line:#33433A;--acc:#7CC49C;--acc-ink:#10241A}}
:root[data-theme="dark"]{--bg:#141B16;--panel:#1D2720;--ink:#E7EFE4;--mute:#98A89C;--line:#33433A;--acc:#7CC49C;--acc-ink:#10241A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 var(--body);letter-spacing:.005em}
h1,h2,button,label,.title{font-family:var(--head)}
header{padding:28px 28px 12px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:28px;letter-spacing:-.02em}
header p{margin:0;color:var(--mute);font-size:15px}
.wrap{display:grid;grid-template-columns:270px 1fr;gap:28px;padding:16px 28px 56px;max-width:1100px;margin:0 auto}

aside{display:flex;flex-direction:column;gap:14px}#list{display:flex;flex-direction:column;gap:10px}
.item{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;color:var(--ink);cursor:pointer;font-size:16px;font-weight:500;line-height:1.4}
.item.on{border-color:var(--acc);box-shadow:inset 4px 0 0 var(--acc)}
.item small{display:block;margin-top:4px;color:var(--mute);font:400 13px var(--body)}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:10px;padding:11px 16px;font-size:16px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:wait}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--hi);outline-offset:1px}
main{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px 34px;min-width:0}
main h2{margin:0 0 10px;font-size:22px}
.hint{color:var(--mute);font-size:15px;margin:0 0 22px}
textarea,input[type=text]{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font:17px/1.85 var(--body)}
textarea{resize:vertical;min-height:120px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:26px 0 12px}
.title{font-size:28px;font-weight:700;border:0;background:transparent;padding:4px 0 10px;letter-spacing:-.01em}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px}
label{display:block;font-size:14px;font-weight:700;margin:26px 0 8px;letter-spacing:.01em}
#notes{min-height:55vh;font-size:18px;line-height:1.95;background:linear-gradient(var(--bg),var(--bg))}
.status{min-height:24px;margin-top:6px;color:var(--mute);font-size:15px}
.status.err{color:#B3361F}
.saved{font-size:13px;color:var(--mute)}
.empty{color:var(--mute);padding:6px 2px}
@media(max-width:760px){.wrap{grid-template-columns:1fr;padding:12px 14px 48px;gap:20px}main{padding:22px 18px}header{padding:22px 18px 8px}}
</style>
</head>
<body>
<header><h1>Recipe Box</h1><p>Paste a recipe or snap a photo. Claude sorts it out and files it in your notebook.</p></header>
<div class="wrap">
<aside><button class="btn" id="newBtn">Add a recipe</button><div id="list"></div></aside>
<main id="main"></main>
</div>
<script>
const KEY="recipebox-v1";
let S={recipes:[],sel:null},sample=null,imgOK=false,tmr;
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=(s)=>document.querySelector(s);
const el=(t,p={},...k)=>{const e=document.createElement(t);Object.assign(e,p);k.forEach(c=>e.append(c));return e};
(async()=>{try{const c=await claude.use("sample");if(c){sample=c;const l=await c.limits().catch(()=>null);imgOK=!!(l&&l.images);window._types=l&&l.images?l.images.mediaTypes.join(","):"";}}catch(e){}render()})();

function renderList(){
  const L=$("#list");L.replaceChildren();
  if(!S.recipes.length)L.append(el("p",{className:"empty",textContent:"No recipes yet."}));
  S.recipes.forEach(r=>{
    const b=el("button",{className:"item"+(r.id===S.sel?" on":"")},r.title||"Untitled",el("small",{textContent:r.time||r.summary?.slice(0,40)||""}));
    b.onclick=()=>{S.sel=r.id;save();render()};L.append(b);
  });
}
function render(){renderList();S.sel&&S.recipes.find(r=>r.id===S.sel)?renderRecipe():renderAdd()}
$("#newBtn").onclick=()=>{S.sel=null;render()};

function renderAdd(){
  const m=$("#main");m.replaceChildren();
  const ta=el("textarea",{placeholder:"Paste the recipe text here (copy it from a website, message, or email)…",rows:8});
  const file=el("input",{type:"file",accept:window._types||"image/*"});
  const st=el("div",{className:"status"});
  const go=el("button",{className:"btn",textContent:"Read this recipe"});
  const blank=el("button",{className:"btn ghost",textContent:"Start a blank recipe"});
  m.append(el("h2",{textContent:"Add a recipe"}),el("p",{className:"hint",textContent:"Paste the text, or take a photo of a cookbook page or handwritten card."}),ta);
  if(imgOK)m.append(el("label",{textContent:"Or add a photo"}),file);
  m.append(el("div",{className:"row"},go,blank),st);
  blank.onclick=()=>{add({title:"New recipe"})};
  go.onclick=async()=>{
    const t=ta.value.trim(),img=file.files&&file.files[0];
    st.className="status";
    if(!t&&!img){st.textContent="Paste some text or choose a photo first.";return}
    if(/^https?:\/\/\S+$/.test(t)&&!img){st.className="status err";st.textContent="This page can't open links. Copy the recipe text from the site and paste it here instead.";return}
    if(!sample){st.className="status err";st.textContent="Claude isn't available in this view. You can still start a blank recipe.";return}
    go.disabled=true;st.textContent="Reading the recipe… this can take up to a minute.";
    const prompt=`Extract the recipe from the content below (and from the attached image, if any). Reply with ONLY JSON: {"title":string,"summary":"2 sentence plain summary","prep":"prep time only, e.g. 15 min","time":"cooking time only, e.g. 30 min","servings":"e.g. 4","ingredients":[string],"steps":[string],"tips":[string]}. Keep ingredient quantities. Tips are short helpful notes found in or clearly implied by the recipe. Use empty arrays if missing.\n\nCONTENT:\n${t}`;
    try{
      const d=await sample.json(prompt,img?{images:img}:{});
      add(d);
    }catch(e){st.className="status err";st.textContent=e.code==="not_granted"?"You'll need to allow Claude to help to read recipes.":"Couldn't read that one. Try again, or paste cleaner text."}
    go.disabled=false;
  };
}
function add(d){
  const r={id:Date.now().toString(36),title:d.title||"Untitled",summary:d.summary||"",prep:d.prep||"",time:d.time||"",servings:d.servings||"",
    ingredients:d.ingredients||[],steps:d.steps||[],tips:d.tips||[],notes:""};
  S.recipes.unshift(r);S.sel=r.id;save();render();
}
function renderRecipe(){
  const r=S.recipes.find(x=>x.id===S.sel),m=$("#main");m.replaceChildren();
  const sv=el("span",{className:"saved",textContent:"Saved"});
  const ch=()=>{sv.textContent="Saving…";clearTimeout(tmr);tmr=setTimeout(()=>{save();renderList();sv.textContent="Saved"},400)};
  const lines=(a)=>a.join("\n");
  const field=(lbl,key,rows,isList)=>{
    const t=el("textarea",{rows,value:isList?lines(r[key]):r[key]});
    t.oninput=()=>{r[key]=isList?t.value.split("\n").map(s=>s.trim()).filter(Boolean):t.value;ch()};
    m.append(el("label",{textContent:lbl}),t);return t};
  const ti=el("input",{type:"text",className:"title",value:r.title});
  ti.oninput=()=>{r.title=ti.value;ch()};
  m.append(ti);
  const t0=el("input",{type:"text",value:r.prep||"",placeholder:"e.g. 15 min"}),t1=el("input",{type:"text",value:r.time,placeholder:"e.g. 45 min"}),t2=el("input",{type:"text",value:r.servings,placeholder:"e.g. 4"});
  t0.oninput=()=>{r.prep=t0.value;ch()};t1.oninput=()=>{r.time=t1.value;ch()};t2.oninput=()=>{r.servings=t2.value;ch()};
  m.append(el("div",{className:"meta"},el("div",{},el("label",{textContent:"Prep time"}),t0),el("div",{},el("label",{textContent:"Cooking time"}),t1),el("div",{},el("label",{textContent:"Servings (how many it feeds)"}),t2)));
  field("Summary","summary",3);
  field("Ingredients (one per line)","ingredients",8,true);
  field("Steps (one per line)","steps",9,true);
  field("Helpful tips","tips",4,true);
  const n=field("My notebook","notes",14);n.id="notes";n.placeholder="Your own notes: swaps you tried, what to change next time, who loved it…";
  const del=el("button",{className:"btn ghost",textContent:"Delete this recipe"});
  del.onclick=()=>{if(confirm("Delete this recipe?")){S.recipes=S.recipes.filter(x=>x.id!==r.id);S.sel=null;save();render()}};
  m.append(el("div",{className:"row"},del,sv));
}
render();
</script>
</body>
</html>
